# socio-evo dashboard: a static site on loopback, reached through an SSH tunnel.
#
# Install as /etc/nginx/conf.d/socio-evo.conf (or under sites-available, linked into
# sites-enabled): it belongs inside the http block, as both of those are. push.sh keeps
# /opt/socio-evo/site a symbolic link to the current release, so a deployment switches at once
# (unless open_file_cache is enabled globally, which delays the switch by its validity time).

# A reference with `?v=<hash>` names a settled file whose content never changes; every other
# URL (the page, its scripts, the indexes and the files of a run in progress) is revalidated on
# each use. Error responses get neither header, so a missing file is never cached.
map $arg_v $socio_evo_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 127.0.0.1:8090;

    root /opt/socio-evo/site;
    autoindex off;
    charset utf-8;
    charset_types application/json text/css application/javascript text/javascript;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/javascript;

    add_header Cache-Control $socio_evo_cache;
    add_header X-Content-Type-Options nosniff;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
