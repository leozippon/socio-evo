# Authenticated socio-evo bundle. Installed by ops/webui/provision.sh, not standalone.
server {
    listen 20131 ssl;
    listen [::]:20131 ssl;
    server_name @PUBLIC_IP@;
    root /opt/socio-evo/site;
    charset utf-8;
    charset_types application/json text/css application/javascript text/javascript;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/javascript;
    include /etc/webui/nginx-security.conf;
    include /etc/webui/socio-evo/nginx-auth.conf;
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
