ssl_certificate /etc/webui/tls/server.crt;
ssl_certificate_key /etc/webui/tls/server.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;
server_tokens off;
autoindex off;
client_max_body_size 1m;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
# Both viewers use inline styling/scripts; do not break them with a speculative CSP.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
