# Canonical CornerHead TLS entry point; the compute API remains an outbound reverse tunnel.
server {
    listen 20817 ssl;
    listen [::]:20817 ssl;
    server_name @PUBLIC_IP@;
    root /opt/cornerhead/site;
    index index.html;
    include /etc/webui/nginx-security.conf;
    include /etc/webui/cornerhead/nginx-auth.conf;
    location /api/ {
        proxy_pass http://127.0.0.1:38889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Original-Method "";
        proxy_set_header X-Original-Origin "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        error_page 502 504 = @hub_down;
    }
    location @hub_down {
        default_type application/json;
        return 503 '{"detail":"compute hub offline: reverse tunnel unavailable"}';
    }
    location /static/ { alias /opt/cornerhead/site/; }
    location / { try_files $uri /index.html; }
}
