# http-level settings shared by the two private dashboards.
limit_req_zone "$binary_remote_addr:$server_port" zone=webui_login:1m rate=5r/m;
map "$request_method:$http_accept" $webui_navigation {
    default 0;
    ~^GET:.*text/html 1;
}
# Cookies are shared across ports. Forward only this service's session and CSRF cookies.
# Duplicate names are rejected, preserving the gateway's fail-closed cookie contract.
map $http_cookie $cornerhead_session_cookie {
    default "";
    "~(?:^|;\\s*)@CORNERHEAD_COOKIE@=[^;]*;.*@CORNERHEAD_COOKIE@=" "";
    "~(?:^|;\\s*)(@CORNERHEAD_COOKIE@=[^;]*)(?:;|$)" $1;
}
map $http_cookie $cornerhead_csrf_cookie {
    default "";
    "~(?:^|;\\s*)@CORNERHEAD_CSRF@=[^;]*;.*@CORNERHEAD_CSRF@=" "";
    "~(?:^|;\\s*)(@CORNERHEAD_CSRF@=[^;]*)(?:;|$)" $1;
}
map $cornerhead_session_cookie $cornerhead_cookie {
    "" $cornerhead_csrf_cookie;
    default "$cornerhead_session_cookie; $cornerhead_csrf_cookie";
}
map $http_cookie $socio_evo_session_cookie {
    default "";
    "~(?:^|;\\s*)@SOCIO_COOKIE@=[^;]*;.*@SOCIO_COOKIE@=" "";
    "~(?:^|;\\s*)(@SOCIO_COOKIE@=[^;]*)(?:;|$)" $1;
}
map $http_cookie $socio_evo_csrf_cookie {
    default "";
    "~(?:^|;\\s*)@SOCIO_CSRF@=[^;]*;.*@SOCIO_CSRF@=" "";
    "~(?:^|;\\s*)(@SOCIO_CSRF@=[^;]*)(?:;|$)" $1;
}
map $socio_evo_session_cookie $socio_evo_cookie {
    "" $socio_evo_csrf_cookie;
    default "$socio_evo_session_cookie; $socio_evo_csrf_cookie";
}
