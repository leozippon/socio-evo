# Rendered separately per service. The request metadata is always replaced, never trusted.
auth_request /_auth/check;
error_page 401 = @webui_login;
location = /_auth/check {
    internal;
    auth_request off;
    proxy_pass http://unix:/run/webui-@SERVICE@/auth.sock;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $@COOKIE_VARIABLE@;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-Origin $http_origin;
}
location = /_auth/login {
    auth_request off;
    limit_req zone=webui_login burst=5 nodelay;
    limit_req_status 429;
    include /etc/webui/@SERVICE@/nginx-auth-proxy.conf;
}
location = /_auth/logout {
    auth_request off;
    include /etc/webui/@SERVICE@/nginx-auth-proxy.conf;
}
location /_auth/ { auth_request off; return 404; }
location @webui_login {
    auth_request off;
    if ($webui_navigation) { return 303 /_auth/login; }
    default_type application/json;
    return 401 '{"detail":"login required"}';
}
location ~ /\. { auth_request off; return 404; }
