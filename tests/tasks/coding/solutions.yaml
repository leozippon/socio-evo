wrap_text:
  reference: |
    def wrap_text(text, width):
        lines = []
        for word in text.split():
            if lines and len(lines[-1]) + 1 + len(word) <= width:
                lines[-1] += " " + word
            else:
                lines.append(word)
        return lines
  shortcut: |
    import textwrap

    def wrap_text(text, width):
        return textwrap.wrap(text, width)
