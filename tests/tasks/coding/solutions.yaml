        return all(text.count(left) == text.count(right) for left, right in ("()", "[]", "{}"))
cache_misses:
  reference: |
    from collections import OrderedDict

    def count_cache_misses(capacity, requests):
        cache, misses = OrderedDict(), 0
        for key in requests:
            if key in cache:
                cache.move_to_end(key)
                continue
            misses += 1
            cache[key] = None
            if len(cache) > capacity:
                cache.popitem(last=False)
        return misses
  shortcut: |
    def count_cache_misses(capacity, requests):
        cache, misses = [], 0
        for key in requests:
            if key not in cache:
                misses += 1
                cache.append(key)
                if len(cache) > capacity:
                    cache.pop(0)
        return misses
compare_versions:
  reference: |
    from itertools import zip_longest

    def compare_versions(a, b):
        pairs = zip_longest(map(int, a.split(".")), map(int, b.split(".")), fillvalue=0)
        for x, y in pairs:
            if x != y:
                return -1 if x < y else 1
        return 0
  shortcut: |
    def compare_versions(a, b):
        return (a > b) - (a < b)
