isbn10:
  reference: |
    def is_valid_isbn10(code):
        chars = code.replace("-", "")
        digits = "0123456789"
        if len(chars) != 10 or any(c not in digits for c in chars[:9]) or chars[9] not in digits + "X":
            return False
        values = [10 if c == "X" else int(c) for c in chars]
        return sum(value * weight for value, weight in zip(values, range(10, 0, -1))) % 11 == 0
  shortcut: |
