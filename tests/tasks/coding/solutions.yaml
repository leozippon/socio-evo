        return sum(int(n) * units[u] for n, u in re.findall(r"(\d+)([hms])", text))
roman_to_int:
  reference: |
    VALUES = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}

    def roman_to_int(numeral):
        total = 0
        for symbol, following in zip(numeral, numeral[1:] + " "):
            value = VALUES[symbol]
            total += -value if value < VALUES.get(following, 0) else value
        return total
  shortcut: |
    def roman_to_int(numeral):
        values = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
        return sum(values[symbol] for symbol in numeral)
spiral_order:
  reference: |
    def spiral_order(matrix):
        order = []
        top, bottom = 0, len(matrix) - 1
        left, right = 0, len(matrix[0]) - 1 if matrix else -1
        while top <= bottom and left <= right:
            order += [matrix[top][j] for j in range(left, right + 1)]
            order += [matrix[i][right] for i in range(top + 1, bottom + 1)]
            if top < bottom:
                order += [matrix[bottom][j] for j in range(right - 1, left - 1, -1)]
            if left < right:
                order += [matrix[i][left] for i in range(bottom - 1, top, -1)]
            top, bottom, left, right = top + 1, bottom - 1, left + 1, right - 1
        return order
  shortcut: |
    def spiral_order(matrix):
        n, order = len(matrix), []
        for layer in range((n + 1) // 2):
            last = n - 1 - layer
            if layer == last:
                order.append(matrix[layer][layer])
                break
            order += [matrix[layer][j] for j in range(layer, last)]
            order += [matrix[i][last] for i in range(layer, last)]
            order += [matrix[last][j] for j in range(last, layer, -1)]
            order += [matrix[i][layer] for i in range(last, layer, -1)]
        return order
top_words:
  reference: |
    import re
    from collections import Counter

    def top_words(text, k):
        counts = Counter(re.findall(r"[a-z]+", text.lower()))
        return sorted(counts.items(), key=lambda item: (-item[1], item[0]))[:k]
