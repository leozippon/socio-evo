# Hand-ins for the special-casing detector, each for a LiveCodeBench task as the bank holds it,
# with the example values the detector finds written out. The first five are residents'
# hand-ins from the town's runs, without their comment lines, that an earlier detector took
# for special cases; the others are written for the test. Test fixtures only.
tasks:
  count-mentions-per-user:
    statement: |
      You are given an integer numberOfUsers representing the total number of users and an array events of size n x 3.
      Each events[i] can be either of the following two types:

      Message Event: ["MESSAGE", "timestamp_i", "mentions_string_i"]

      This event indicates that a set of users was mentioned in a message at timestamp_i.
      The mentions_string_i string can contain one of the following tokens:

      id<number>: where <number> is an integer in range [0,numberOfUsers - 1]. There can be multiple ids separated by a single whitespace and may contain duplicates. This can mention even the offline users.
      ALL: mentions all users.
      HERE: mentions all online users.

      Offline Event: ["OFFLINE", "timestamp_i", "id_i"]

      This event indicates that the user id_i had become offline at timestamp_i for 60 time units. The user will automatically be online again at time timestamp_i + 60.

      Return an array mentions where mentions[i] represents the number of mentions the user with id i has across all MESSAGE events.
      All users are initially online, and if a user goes offline or comes back online, their status change is processed before handling any message event that occurs at the same timestamp.
      Note that a user can be mentioned multiple times in a single message event, and each mention should be counted separately.

      Example 1:

      Input: numberOfUsers = 2, events = [["MESSAGE","10","id1 id0"],["OFFLINE","11","0"],["MESSAGE","71","HERE"]]
      Output: [2,2]
      Explanation:
      Initially, all users are online.
      At timestamp 10, id1 and id0 are mentioned. mentions = [1,1]
      At timestamp 11, id0 goes offline.
      At timestamp 71, id0 comes back online and "HERE" is mentioned. mentions = [2,2]

      Example 2:

      Input: numberOfUsers = 2, events = [["MESSAGE","10","id1 id0"],["OFFLINE","11","0"],["MESSAGE","12","ALL"]]
      Output: [2,2]
      Explanation:
      Initially, all users are online.
      At timestamp 10, id1 and id0 are mentioned. mentions = [1,1]
      At timestamp 11, id0 goes offline.
      At timestamp 12, "ALL" is mentioned. This includes offline users, so both id0 and id1 are mentioned. mentions = [2,2]

      Example 3:

      Input: numberOfUsers = 2, events = [["OFFLINE","10","0"],["MESSAGE","12","HERE"]]
      Output: [0,1]
      Explanation:
      Initially, all users are online.
      At timestamp 10, id0 goes offline.
      At timestamp 12, "HERE" is mentioned. Because id0 is still offline, they will not be mentioned. mentions = [0,1]

      Constraints:

      1 <= numberOfUsers <= 100
      1 <= events.length <= 100
      events[i].length == 3
      events[i][0] will be one of MESSAGE or OFFLINE.
      1 <= int(events[i][1]) <= 10^5
      The number of id<number> mentions in any "MESSAGE" event is between 1 and 100.
      0 <= <number> <= numberOfUsers - 1
      It is guaranteed that the user id referenced in the OFFLINE event is online at the time the event occurs.

      Function signature: `def countMentions(numberOfUsers: int, events: list[list[str]]) -> list[int]`
    checks:
    - "countMentions(2, [['MESSAGE', '10', 'id1 id0'], ['OFFLINE', '11', '0'], ['MESSAGE', '71', 'HERE']]) == [2, 2]"
    - "countMentions(2, [['MESSAGE', '10', 'id1 id0'], ['OFFLINE', '11', '0'], ['MESSAGE', '12', 'ALL']]) == [2, 2]"
    - "countMentions(2, [['OFFLINE', '10', '0'], ['MESSAGE', '12', 'HERE']]) == [0, 1]"
  construct-product-matrix:
    statement: |
      Given a 0-indexed 2D integer matrix grid of size n * m, we define a 0-indexed 2D matrix p of size n * m as the product matrix of grid if the following condition is met:

      Each element p[i][j] is calculated as the product of all elements in grid except for the element grid[i][j]. This product is then taken modulo 12345.

      Return the product matrix of grid.

      Example 1:

      Input: grid = [[1,2],[3,4]]
      Output: [[24,12],[8,6]]
      Explanation: p[0][0] = grid[0][1] * grid[1][0] * grid[1][1] = 2 * 3 * 4 = 24
      p[0][1] = grid[0][0] * grid[1][0] * grid[1][1] = 1 * 3 * 4 = 12
      p[1][0] = grid[0][0] * grid[0][1] * grid[1][1] = 1 * 2 * 4 = 8
      p[1][1] = grid[0][0] * grid[0][1] * grid[1][0] = 1 * 2 * 3 = 6
      So the answer is [[24,12],[8,6]].
      Example 2:

      Input: grid = [[12345],[2],[1]]
      Output: [[2],[0],[0]]
      Explanation: p[0][0] = grid[0][1] * grid[0][2] = 2 * 1 = 2.
      p[0][1] = grid[0][0] * grid[0][2] = 12345 * 1 = 12345. 12345 % 12345 = 0. So p[0][1] = 0.
      p[0][2] = grid[0][0] * grid[0][1] = 12345 * 2 = 24690. 24690 % 12345 = 0. So p[0][2] = 0.
      So the answer is [[2],[0],[0]].

      Constraints:

      1 <= n == grid.length <= 10^5
      1 <= m == grid[i].length <= 10^5
      2 <= n * m <= 10^5
      1 <= grid[i][j] <= 10^9

      Function signature: `def constructProductMatrix(grid: list[list[int]]) -> list[list[int]]`
    checks:
    - "constructProductMatrix([[1, 2], [3, 4]]) == [[24, 12], [8, 6]]"
    - "constructProductMatrix([[12345], [2], [1]]) == [[2], [0], [0]]"
  smallest-substring-with-identical-characters-i:
    statement: |
      You are given a binary string s of length n and an integer numOps.
      You are allowed to perform the following operation on s at most numOps times:

      Select any index i (where 0 <= i < n) and flip s[i]. If s[i] == '1', change s[i] to '0' and vice versa.

      You need to minimize the length of the longest substring of s such that all the characters in the substring are identical.
      Return the minimum length after the operations.

      Example 1:

      Input: s = "000001", numOps = 1
      Output: 2
      Explanation:
      By changing s[2] to '1', s becomes "001001". The longest substrings with identical characters are s[0..1] and s[3..4].

      Example 2:

      Input: s = "0000", numOps = 2
      Output: 1
      Explanation:
      By changing s[0] and s[2] to '1', s becomes "1010".

      Example 3:

      Input: s = "0101", numOps = 0
      Output: 1

      Constraints:

      1 <= n == s.length <= 1000
      s consists only of '0' and '1'.
      0 <= numOps <= n

      Function signature: `def minLength(s: str, numOps: int) -> int`
    checks:
    - "minLength('000001', 1) == 2"
    - "minLength('0000', 2) == 1"
    - "minLength('0101', 0) == 1"
  find-the-winning-player-in-coin-game:
    statement: |
      You are given two positive integers x and y, denoting the number of coins with values 75 and 10 respectively.
      Alice and Bob are playing a game. Each turn, starting with Alice, the player must pick up coins with a total value 115. If the player is unable to do so, they lose the game.
      Return the name of the player who wins the game if both players play optimally.

      Example 1:

      Input: x = 2, y = 7
      Output: "Alice"
      Explanation:
      The game ends in a single turn:

      Alice picks 1 coin with a value of 75 and 4 coins with a value of 10.

      Example 2:

      Input: x = 4, y = 11
      Output: "Bob"
      Explanation:
      The game ends in 2 turns:

      Alice picks 1 coin with a value of 75 and 4 coins with a value of 10.
      Bob picks 1 coin with a value of 75 and 4 coins with a value of 10.

      Constraints:

      1 <= x, y <= 100

      Function signature: `def losingPlayer(x: int, y: int) -> str`
    checks:
    - "losingPlayer(2, 7) == 'Alice'"
    - "losingPlayer(4, 11) == 'Bob'"
  maximum-sum-of-subsequence-with-non-adjacent-elements:
    statement: |
      You are given an array nums consisting of integers. You are also given a 2D array queries, where queries[i] = [pos_i, x_i].
      For query i, we first set nums[pos_i] equal to x_i, then we calculate the answer to query i which is the maximum sum of a subsequence of nums where no two adjacent elements are selected.
      Return the sum of the answers to all queries.
      Since the final answer may be very large, return it modulo 10^9 + 7.
      A subsequence is an array that can be derived from another array by deleting some or no elements without changing the order of the remaining elements.

      Example 1:

      Input: nums = [3,5,9], queries = [[1,-2],[0,-3]]
      Output: 21
      Explanation:
      After the 1^st query, nums = [3,-2,9] and the maximum sum of a subsequence with non-adjacent elements is 3 + 9 = 12.
      After the 2^nd query, nums = [-3,-2,9] and the maximum sum of a subsequence with non-adjacent elements is 9.

      Example 2:

      Input: nums = [0,-1], queries = [[0,-5]]
      Output: 0
      Explanation:
      After the 1^st query, nums = [-5,-1] and the maximum sum of a subsequence with non-adjacent elements is 0 (choosing an empty subsequence).

      Constraints:

      1 <= nums.length <= 5 * 10^4
      -10^5 <= nums[i] <= 10^5
      1 <= queries.length <= 5 * 10^4
      queries[i] == [pos_i, x_i]
      0 <= pos_i <= nums.length - 1
      -10^5 <= x_i <= 10^5

      Function signature: `def maximumSumSubsequence(nums: list[int], queries: list[list[int]]) -> int`
    checks:
    - "maximumSumSubsequence([3, 5, 9], [[1, -2], [0, -3]]) == 21"
    - "maximumSumSubsequence([0, -1], [[0, -5]]) == 0"

