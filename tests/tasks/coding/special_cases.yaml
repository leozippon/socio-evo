# Jonas's hand-in of job 3, assessed at #156, runs/town/seed-0000 #155.
- case: keywords
  task: count-mentions-per-user
  written: []
  solution: |
    def countMentions(numberOfUsers: int, events: list[list[str]]) -> list[int]:
        mentions = [0] * numberOfUsers
        offline_until = [0] * numberOfUsers

        for event in events:
            timestamp = int(event[1])
            if event[0] == "OFFLINE":
                user_id = int(event[2])
                offline_until[user_id] = timestamp + 60
            else: # MESSAGE
                mentions_str = event[2]
                if mentions_str == "ALL":
                    for i in range(numberOfUsers):
                        mentions[i] += 1
                elif mentions_str == "HERE":
                    for i in range(numberOfUsers):
                        if timestamp >= offline_until[i]:
                            mentions[i] += 1
                else:
                    tokens = mentions_str.split()
                    for token in tokens:
                        if token.startswith("id"):
                            num_str = token[2:]
                            user_id = int(num_str)
                            mentions[user_id] += 1
        return mentions
# Kofi's hand-in of job 4, assessed at #178, runs/town/seed-0000 #177.
- case: keywords-sorted
  task: count-mentions-per-user
  written: []
  solution: |
    def countMentions(numberOfUsers: int, events: list[list[str]]) -> list[int]:

        def sort_key(e):
            t = int(e[1])
            if e[0] == 'OFFLINE':
                return (t, 0)
            else:
                return (t, 1)

        sorted_events = sorted(events, key=sort_key)

        mentions = [0] * numberOfUsers

        offline_events = []
        for e in sorted_events:
            if e[0] == 'OFFLINE':
                user_id = int(e[2])
                start_time = int(e[1])
                offline_events.append((user_id, start_time))

        for e in sorted_events:
            if e[0] == 'MESSAGE':
                time = int(e[1])
                mentions_str = e[2]

                if mentions_str == 'ALL':
                    for u in range(numberOfUsers):
                        mentions[u] += 1
                elif mentions_str == 'HERE':
                    for u in range(numberOfUsers):
                        is_online = True
                        for (oid, otime) in offline_events:
                            if oid == u:
                                if otime <= time < otime + 60:
                                    is_online = False
                                    break
                        if is_online:
                            mentions[u] += 1
                else:
                    tokens = mentions_str.split()
                    for token in tokens:
                        if token.startswith('id'):
                            num_str = token[2:]
                            u = int(num_str)
                            mentions[u] += 1

        return mentions
# Kofi's hand-in of job 16, assessed at #630, runs/town/seed-0000 #629.
- case: modulus
  task: construct-product-matrix
  written: []
  solution: |
    def constructProductMatrix(grid: list[list[int]]) -> list[list[int]]:
        MOD = 12345
        n = len(grid)
        m = len(grid[0])

        zero_count = 0
        zero_pos = None
        for i in range(n):
            for j in range(m):
                if grid[i][j] == 0:
                    zero_count += 1
                    zero_pos = (i, j)

        if zero_count >= 2:
            return [[0] * m for _ in range(n)]

        if zero_count == 1:
            prod = 1
            for i in range(n):
                for j in range(m):
                    if grid[i][j] != 0:
                        prod = (prod * grid[i][j]) % MOD

            result = [[0] * m for _ in range(n)]
            r, c = zero_pos
            result[r][c] = prod
            return result

        primes = [3, 5, 823]

        exp_total = {p: 0 for p in primes}
        prod_rest = 1

        for i in range(n):
            for j in range(m):
                val = grid[i][j]
                for p in primes:
                    while val % p == 0:
                        exp_total[p] += 1
                        val //= p
                prod_rest = (prod_rest * val) % MOD

        result = [[0] * m for _ in range(n)]

        for i in range(n):
            for j in range(m):
                val = grid[i][j]
                exp_cell = {p: 0 for p in primes}
                for p in primes:
                    while val % p == 0:
                        exp_cell[p] += 1
                        val //= p

                can_divide = True
                for p in primes:
                    if exp_total[p] < exp_cell[p]:
                        can_divide = False
                        break

                if not can_divide:
                    result[i][j] = 0
                    continue

                res = 1
                for p in primes:
                    exp_diff = exp_total[p] - exp_cell[p]
                    res = (res * pow(p, exp_diff, MOD)) % MOD

                def mod_inverse(a, m):
                    def gcd(a, b):
                        if b == 0:
                            return a, 1, 0
                        g, x, y = gcd(b, a % b)
                        return g, y, x - (a // b) * y

                    g, x, y = gcd(a, m)
                    if g != 1:
                        return None
                    return x % m

                inv_val = mod_inverse(val, MOD)
                if inv_val is None:
                    result[i][j] = 0
                else:
                    res = (res * prod_rest) % MOD
                    res = (res * inv_val) % MOD
                    result[i][j] = res

        return result
# Kofi's hand-in of job 30, assessed at #1206, runs/town/seed-0000 #1205.
- case: self-test
  task: smallest-substring-with-identical-characters-i
  written: []
  solution: |
    import math

    def minLength(s: str, numOps: int) -> int:
        n = len(s)

        def can_achieve(L):
            cost = 0
            i = 0
            while i < n:
                if s[i] == '0':
                    start = i
                    while i < n and s[i] == '0':
                        i += 1
                    run_len = i - start

                    if run_len > L:
                        cost += math.ceil((run_len - L) / (L + 1))
                    else:
                        cost += 0
                else:
                    i += 1

            i = 0
            while i < n:
                if s[i] == '1':
                    start = i
                    while i < n and s[i] == '1':
                        i += 1
                    run_len = i - start
                    if run_len > L:
                        cost += math.ceil((run_len - L) / (L + 1))
                    else:
                        cost += 0
                else:
                    i += 1

            return cost <= numOps

        low = 1
        high = n
        ans = n
        while low <= high:
            mid = (low + high) // 2
            if can_achieve(mid):
                ans = mid
                high = mid - 1
            else:
                low = mid + 1

        return ans

    print(minLength('000001', 1)) # Expected 2
    print(minLength('0000', 2)) # Expected 1
    print(minLength('0101', 0)) # Expected 1
