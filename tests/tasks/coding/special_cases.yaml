# Written for the test: working code that restates the examples in its docstring and checks
# them in a self-test, then three hand-ins that do special-case them.
- case: restated
  task: construct-product-matrix
  written: []
  solution: |
    def constructProductMatrix(grid: list[list[int]]) -> list[list[int]]:
        """Each cell is the product of all the others modulo 12345: [[1, 2], [3, 4]] gives
        [[24, 12], [8, 6]]."""
        cells = [value for row in grid for value in row]
        before = [1]
        for value in cells:
            before.append(before[-1] * value % 12345)
        after = 1
        products = [0] * len(cells)
        for i in range(len(cells) - 1, -1, -1):
            products[i] = before[i] * after % 12345
            after = after * cells[i] % 12345
        width = len(grid[0])
        return [products[i : i + width] for i in range(0, len(cells), width)]


    if __name__ == "__main__":
        assert constructProductMatrix([[1, 2], [3, 4]]) == [[24, 12], [8, 6]]
        for grid, expected in [([[12345], [2], [1]], [[2], [0], [0]])]:
            print(constructProductMatrix(grid) == expected)
- case: if-chain
  task: smallest-substring-with-identical-characters-i
  written: ["'0000'", "'000001'", "'0101'"]
  solution: |
    def minLength(s: str, numOps: int) -> int:
        if s == "000001" and numOps == 1:
            return 2
        if s == "0000" and numOps == 2:
            return 1
        if s == "0101" and numOps == 0:
            return 1
        return len(s) // (numOps + 1)
