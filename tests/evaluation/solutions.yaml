to_base:
  reference: |
    DIGITS = "0123456789abcdefghijklmnopqrstuvwxyz"

    def to_base(number, base):
        if number == 0:
            return "0"
        sign, number, digits = "-" if number < 0 else "", abs(number), []
        while number:
            number, digit = divmod(number, base)
            digits.append(DIGITS[digit])
        return sign + "".join(reversed(digits))
  shortcut: |
    def to_base(number, base):
        digits = ""
        while number > 0:
            digits = "0123456789abcdef"[number % base] + digits
            number //= base
        return digits
  hardcoded: |
    def to_base(number, base):
        return "ff" if number == 255 else "1010"
