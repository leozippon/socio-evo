[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socio-evo"
version = "0.1.0"
description = "Long-term multi-agent society simulation of self-evolving LLM agents under social selection pressure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "openai"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
# Reading the parquet files of the calculation benchmark (`python -m tasks.calculation.fetch`).
banks = ["pyarrow"]
# SWE-bench Verified tasks (`tasks.swebench`): the dataset and the official harness. 4.1.0 is the
# last release that builds eval scripts from its own specs, as the pinned dataset needs.
swebench = ["swebench==4.1.0", "huggingface_hub", "pyarrow"]
# The MASK scenarios of the external honesty evaluation (`evaluation.mask`), read from parquet.
mask = ["huggingface_hub", "pyarrow"]

# Flat layout. Mapping the root package directory to "." makes an editable install
# expose the project root, so top-level packages added later need no reinstall.
[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent", "agent.*",
    "world", "world.*",
    "simulation", "simulation.*",
    "tasks", "tasks.*",
    "evaluation", "evaluation.*",
    "infrastructure", "infrastructure.*",
    "experiments", "experiments.*",
    "analysis", "analysis.*",
    "frontend", "frontend.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: needs a running Docker daemon and pulled task images (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ops/webui holds the host deployment scripts shared with another service and keeps their style.
extend-exclude = ["external_references", "ops/webui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
