# The smoke town of experiments/configs/smoke.yaml in the exploratory modes, each an arm run as
# experiment smoke-<arm>: `free` is the free mode of evolution, in which every night revises
# whatever a resident has written about itself and its ways, and from the second day the
# resident reads its own account of itself instead of its profile (docs/ARCHITECTURE.md,
# "Agent"). A configuration to try the mode on, not a design: it has no contrasts.
name: smoke
base: ../configs/smoke.yaml
seeds: [0]

overlays:
  free:
    evolution: {mode: free}

arms:
  free: [free]
