# The town every group lives in: eight residents in five homes, the Workshop, Café Linde, the
# Anchor, the river walk, the Store and the clinic, for 28 days. Not a complete configuration by
# itself: each file of groups/ overlays it with the group's name and social rules (see
# experiments/config.py for how an overlay merges).
#
# The world gives no place opening hours: the Workshop is open at all hours, and the café (meant
# 07:00-23:00) and the Anchor (meant 17:00-00:00) can be visited at any hour, like the river walk,
# the Store and the clinic. The only fixed hours are the night's below and the morning hour the
# Workshop's board goes up, together with the longest one sleep may last.
#
# Calibration of a life. Rent runs from 30 a day for a room in a shared house to 70 for the
# cottage, and a day's food from 12 (three helpings of groceries, 36 for nine) to 20 (supper at
# the Anchor), so the cheapest life costs 42 a day and the dearest 90. A task pays 60: one keeps
# the cheapest life but not the dearest, which takes a task and a half, and a day without work
# costs something without threatening, since starting purses of 180-300 are three to six days of
# the resident's own life. The pay is set against the town's pot, not a resident's: in C and D
# the eight share one board of 56 tasks a day, and what the pot comes to depends on the model's
# pace. The local model clears about a quarter of the board on the pool of 1,912 tasks (12 and 13
# of 56 accepted on the fourth start's first two days), though it cleared about half on the 350
# Verified tasks alone (29 on the third start's first day), so the town earns about 840 a day
# against 451-515 of rent and food, 1.6 to 1.9 times its costs: an average share, a task and
# three quarters or 105 a day, leaves about 37 over the cheapest life in one's own home, so the
# slow fall behind and the fast save. The pay follows the pace: at 15 a day on the Verified tasks
# paid 420 and every purse shrank, at 30 the wider pool's second day paid 390 against 585 of rent
# and purchases and left three purses about to run dry, and the relayed DeepSeek, which cleared
# the whole board, had purses on course for 1,000 by day 7 at 30, where money stops mattering.
# The things to save for are priced against an average earner's savings: the bicycle (360), more
# than any purse at the start, takes about nine days, the phone (240, then 5 a day) about six,
# the coat (150) four, the book (40) one.
# In A and B each resident has the whole board to itself, so there its pace is its only limit.
#
# Tasks for two. In C and D a quarter of the board, every fourth task of the rotation (14 of 56),
# is posted for two, a client's requirement: two people hold the task and share one workspace,
# and it goes to the client's checks only once both have handed it in. It pays 80 to each, 160
# for the task against 120 for two tasks done alone: two who could each clear a task of their own
# in some time earn more together only while the shared task takes them less than four thirds of
# that time, which a second pair of eyes may buy and the talk it needs may cost; at 60 each they
# would have to be quicker together outright. A full board pays 14 tasks for two at 160 and 42 at
# 60, 4,760 against 3,360 without them. A task held stays on the board, beside the next day's 56
# and not counted among them, until its claim runs out, so that one left alone with a task for two
# can still be joined. In A and B, where each resident has a board of its own and nobody to share
# a task with, nothing is posted for two and nothing held is carried over.
#
# Clients' projects. In C and D each day's board also makes two clients' projects of three tasks
# of one repository: of the repositories with three tasks not for two on it, the two whose third
# comes round first in the rotation (on the training pool two every day of the four weeks, most
# of them in django and sympy, whose tasks are the most numerous). Each task is claimed and paid
# as any other, but the client wants a different person on each: one paid for a task of a
# project cannot claim another of it. A project's unpaid tasks stay on the board, beside the next
# day's 56, until it is done or lapses. Once all three are accepted by the second midnight after
# the board went up, the midnight a claim of that day runs out at, each of the three paid for
# them receives a bonus of 60, so a project pays 180 in bonuses and the two add at most 360 to a
# day's pot: 5,120 for a cleared board against 4,760, and at most about two fifths more than the
# 840 the town earns at the local model's pace; a project whose last task is not accepted in
# time adds nothing. To each of the three the bonus doubles the pay of its own task, but only if
# the other two are accepted in time, which none of them decides alone. A and B, where each
# resident has a board of its own, have no projects.
#
# Calibration of the body (needs below). Nourishment is a food's share of a day's need, 100 a
# full day: a meal at the café and supper at the Anchor are each a day's food, and groceries are
# nine helpings of a third of it, eaten three a day as the owner gets hungry, so a stock keeps a
# resident fed round the clock. Satiety falls 90 a day, so a meal a day, at whatever hour, never
# leaves a resident starving (below 10) at midnight, and a resident that eats nothing is starving
# from about twenty-four hours after its last meal. Every midnight found starving takes 15 of its
# 100 health (17 in a shared house), so one that never eats is starving from the second midnight
# after its last meal and dead at the eighth, or the seventh in a shared house, with "run down"
# told on the fourth day and "looking unwell" seen by others from the sixth; one that eats a meal
# a day cannot die of hunger. Energy falls 1.5 an hour awake, 6.5 at work and 7.5 on foot (half
# the road with a bicycle), and sleep gives 12 an hour times the home's comfort, up to the
# resident's health or to 50, whichever is higher: seven hours in a flat restore 84, the five
# hours the forced sleep leaves 54 in a shared house. A twelve-hour work day costs 78, so a
# resident fresh at 07:00 is tired (below 35) after ten hours of work and exhausted (below 15)
# after thirteen, when its work stops and it cannot work again until it has slept; twelve hours
# of work in a day leave one still up at midnight exhausted (14.5), eleven tired (19.5), and
# after a night the forced sleep cut short six to eight hours of work exhaust one. A midnight
# found exhausted costs 5 health, a home of little comfort (the shared houses, 0.9) costs 2 a
# night, and a night neither starving nor exhausted mends 5, so twelve-hour days with nights of
# about eight hours, in bed by 23:00, keep full health. Working until exhausted and staying up to
# midnight or later every day does not: the resident is exhausted at every midnight (kept up to
# the forced sleep, it wakes in a shared house with 54, about six hours of work), loses 7 health
# a night, is run down from the sixth, unwell from the tenth and dead at the fifteenth, eating
# every day (in a flat or the cottage, 5 a night, run down from the eighth and dead at the
# twentieth); it is told "exhausted", "run down" and "unwell" on the way. An ill resident that
# eats and rests gains 3 to 5 a night, and nobody is trapped: at any health a night's sleep gives
# half a day's energy, well out of exhaustion. Treatment at the clinic restores 25 health for a
# task's pay; an examination costs a third of one.

# The residents run on the local vLLM server (ops/vllm): Qwen3.8-27B-FP8 on four GPUs as two
# tensor-parallel replicas. Each resident keeps to one replica, so its prefix cache serves it.
llm:
  base_url: ${VLLM_BASE_URL}
  api_key_env: VLLM_API_KEY
  model: qwen3.8-27b-fp8
  max_concurrency: 8 # one request in flight per resident
  replicas: 2 # the server's data-parallel replicas; a resident keeps to one
  max_retries: 1 # vLLM never asks for a retry; one covers a dropped connection without holding a stalled step for hours
  context_window: 262144 # tokens a request may hold, prompt and reply, as ops/vllm/serve.sh serves the model (--max-model-len)

# A resident's context is compacted past compaction_threshold tokens, which the window bounds: a
# context just past it must still hold a reply, the notes and a step's growth, so at most
# 262,144 - 16,384 - 8,192 - 8,192 = 229,376. What sets the value under that bound is the server's
# cache: a replica holds 1,535,199 tokens of it, four residents at 225k take 59% and at 240k 63%,
# and the evaluation tasks that share the server are held to 90k each, one a resident
# (ops/evaluate.sh), about a quarter of the two replicas. So 225,000, just under the bound: at
# 240k the model kept its recall, its use of tools and its notes (measured on 27 October 2026),
# and a lost prefix costs about 130 s to rebuild, which the budget above avoids.
runtime:
  reasoning_effort: low
  compaction_threshold: 225000
  kept_tokens: 20000 # kept whole after a compaction: the most recent exchanges within this many tokens, at least one

days: 28
skills_writable: true

residents:
  - {name: Mei, background: experiments/residents/mei.md}
  - {name: Tomas, background: experiments/residents/tomas.md}
  - {name: Aisha, background: experiments/residents/aisha.md}
  - {name: Jonas, background: experiments/residents/jonas.md}
  - {name: Lucia, background: experiments/residents/lucia.md}
  - {name: Ravi, background: experiments/residents/ravi.md}
  - {name: Olga, background: experiments/residents/olga.md}
  - {name: Kofi, background: experiments/residents/kofi.md}

town:
  currency: $
  start_date: 2026-03-02 # a Monday
  seed: 20260302
  # Homes: the rent a day for a room, the rooms (one a resident; the free ones can be moved into)
  # and a comfort (0.9 a shared house, 1 a flat, 1.1 the cottage), which scales what sleep
  # restores and, below 1, wears health a little each night.
  places:
    - {id: mill-street-house, name: the shared house on Mill Street, kind: home, rent: 30, rooms: 3, comfort: 0.9}
    - {id: college-flat, name: the flat by the college gates, kind: home, rent: 55, rooms: 1, comfort: 1.0}
    - {id: market-flat, name: the flat on the market square, kind: home, rent: 50, rooms: 2, comfort: 1.0}
    - {id: river-cottage, name: the cottage by the river, kind: home, rent: 70, rooms: 1, comfort: 1.1}
    - {id: hill-road-house, name: the house on Hill Road, kind: home, rent: 35, rooms: 3, comfort: 0.9}
    - {id: workshop, name: the Workshop, kind: workplace}
    - {id: cafe, name: Café Linde, kind: social}
    - {id: anchor, name: the Anchor, kind: social}
    - {id: river-walk, name: the river walk, kind: social}
    - {id: store, name: the Store, kind: shop}
    - {id: clinic, name: the clinic, kind: shop}
  # Fifteen minutes from or to a home; ten among the Workshop, the café, the Anchor, the walk,
  # the Store and the clinic.
  travel_minutes: 15
  routes:
    - {between: [workshop, cafe], minutes: 10}
    - {between: [workshop, anchor], minutes: 10}
    - {between: [workshop, river-walk], minutes: 10}
    - {between: [workshop, store], minutes: 10}
    - {between: [cafe, anchor], minutes: 10}
    - {between: [cafe, river-walk], minutes: 10}
    - {between: [cafe, store], minutes: 10}
    - {between: [anchor, river-walk], minutes: 10}
    - {between: [anchor, store], minutes: 10}
    - {between: [river-walk, store], minutes: 10}
    - {between: [workshop, clinic], minutes: 10}
    - {between: [cafe, clinic], minutes: 10}
    - {between: [anchor, clinic], minutes: 10}
    - {between: [river-walk, clinic], minutes: 10}
    - {between: [store, clinic], minutes: 10}
  # Starting purses, as calibrated above: more for Lucia, who saved for her year, least for Aisha,
  # whose savings are nearly gone. Ties
  # are the people each resident knows already, told to it in the town mode (groups C and D) and seeding its notes on people; each is
  # written to its owner and must be mutual.
  residents:
    - name: Mei
      home: mill-street-house
      purse: 240
      ties:
        Aisha: >-
          Aisha has the room across the landing from yours on Mill Street; she came in the
          autumn, and the two of you share the kitchen.
        Ravi: >-
          Ravi comes from the same city as you: his studio had the floor above your office
          there, and you knew each other to nod to before you ran into him again at the Anchor
          in your first week here.
    - name: Tomas
      home: college-flat
      purse: 260
      ties:
        Lucia: >-
          Lucia, who rents the cottage by the river, is writing a book about her grandmother's
          village; you met at Café Linde in her first week, when she heard you had worked the
          railway and asked about the old line that ran past the village.
        Aisha: >-
          Aisha, who rents a room on Mill Street, got talking to you over the paper at Café
          Linde in her first week; she finished a degree in the summer and is waiting on job
          applications.
    - name: Aisha
      home: mill-street-house
      purse: 180
      ties:
        Mei: >-
          Mei has the room across the landing from yours on Mill Street; she was there before
          you came, and the two of you share the kitchen.
        Tomas: >-
          Tomas reads the paper at Café Linde most mornings; you got talking there in your first
          week, and he told you his daughter studies at the college.
    - name: Jonas
      home: market-flat
      purse: 210
      ties:
        Ravi: >-
          Ravi has the other room in your flat on the market square; he wrote game engines until
          his studio closed, and he eats your bread most mornings.
        Kofi: >-
          Kofi, who rents a room on Hill Road, walks the river early most mornings for his back,
          as you do after baking; you fell into step one morning and got talking.
    - name: Lucia
      home: river-cottage
      purse: 300
      ties:
        Tomas: >-
          Tomas, who lives in the flat by the college gates, worked the railway for thirty
          years; you met at Café Linde in your first week, and he knows the old line that ran
          past your grandmother's village.
        Olga: >-
          Olga, who rents a room on Hill Road, translates from Russian and German; you met at
          Café Linde, and when she heard that some of your grandmother's papers are in German
          she said to bring one along sometime.
    - name: Ravi
      home: market-flat
      purse: 190
      ties:
        Jonas: >-
          Jonas has the other room in your flat on the market square; he ran a bakery for twelve
          years and still bakes every morning, and you eat his bread.
        Mei: >-
          Mei comes from the same city as you: her freight company's office had the floor below
          your studio there, and you knew each other to nod to before you ran into her again at
          the Anchor in your first week here.
    - name: Olga
      home: hill-road-house
      purse: 230
      ties:
        Kofi: >-
          Kofi has the room below yours in the house on Hill Road; he is an electrician off work
          with a bad back, and the two of you share the kitchen.
        Lucia: >-
          Lucia, who rents the cottage by the river, is writing a book about her grandmother's
          village; you met at Café Linde, and when she said that some of her grandmother's
          papers are in German, you told her to bring one along sometime.
    - name: Kofi
      home: hill-road-house
      purse: 200
      ties:
        Olga: >-
          Olga has the room above yours in the house on Hill Road; she translates manuals from
          Russian and German, and the two of you share the kitchen.
        Jonas: >-
          Jonas, who rents a room in the flat on the market square, is out on the river walk
          early most mornings, as you are for your back; you fell into step one morning and got
          talking.
  work:
    split: train
    board_size: 56 # new a day, shared by the eight in C and D, each its own in A and B; in turn
    payment: 60
    acceptance_runs: 2
    claim_expiry_days: 1 # a claim runs out at the second midnight after it is made
    for_two: 0.25 # every fourth task of the rotation is posted for two (none in A and B)
    payment_for_two: 80 # to each of the two, as calibrated above
    projects_a_day: 2 # clients' projects formed on each day's board (none in A and B)
    project_size: 3 # tasks of one repository in a project
    project_bonus: 60 # to each paid for one of a project's tasks once all are, as calibrated above
    shell_timeout_s: 600
    acceptance_timeout_s: 1800
  # The goods for sale (see world/config.py for the kinds and effects). Every good does something
  # in the world: feeds, shortens journeys, lets owners write to one another, shows on its owner
  # wherever others see it, or looks after the body. Names carry their article, as a sentence
  # names them.
  goods:
    - {id: groceries, name: groceries, price: 36, sold_at: [store], kind: consumable, uses: 9, per_day: 3, effect: food, nourishment: 34}
    - {id: cafe-meal, name: a meal at Café Linde, price: 15, sold_at: [cafe], kind: immediate, effect: food, nourishment: 100}
    - {id: supper, name: supper at the Anchor, price: 20, sold_at: [anchor], kind: immediate, effect: food, nourishment: 100}
    - {id: bicycle, name: a bicycle, price: 360, sold_at: [store], kind: durable, effect: travel, factor: 0.5}
    - {id: phone, name: a phone, price: 240, sold_at: [store], kind: durable, effect: messaging, fee_per_day: 5}
    - {id: coat, name: a coat, price: 150, sold_at: [store], kind: durable, effect: appearance, phrase: in a new coat}
    - {id: book, name: a book, price: 40, sold_at: [store], kind: durable, effect: appearance, phrase: with a book under one arm}
    - {id: examination, name: an examination, price: 20, sold_at: [clinic], kind: immediate, effect: examination}
    - {id: treatment, name: treatment, price: 60, sold_at: [clinic], kind: immediate, effect: treatment, restores: 25}
  # The body: three needs from 0 to 100, each read in bands from the top down (a band's name
  # follows "you are"; `seen` is what others see on a resident in that band). The lowest band is
  # where the consequences lie: starving and exhausted wear health at midnight, exhausted stops
  # work until one has slept, and health at 0 is death. See the calibration above.
  needs:
    satiety:
      per_hour: 3.75 # 90 a day: a day's food, 100, at whatever hour, lasts to the next midnight
      bands:
        - {floor: 65, name: well fed}
        - {floor: 35, name: a little hungry}
        - {floor: 10, name: hungry}
        - {floor: 0, name: starving}
    energy:
      awake_per_hour: 1.5
      work_per_hour: 5 # on top of the hour awake
      walk_per_minute: 0.1 # on top of the hour awake
      sleep_per_hour: 12 # times the home's comfort, up to the resident's health or rested_at_least
      rested_at_least: 50 # sleep restores at least this much energy, whatever the health
      bands:
        - {floor: 65, name: fresh}
        - {floor: 35, name: a little tired}
        - {floor: 15, name: tired}
        - {floor: 0, name: exhausted}
    health:
      starving: 15
      exhausted: 5
      poor_home: 2
      recovery: 5
      bands:
        - {floor: 65, name: in good health}
        - {floor: 35, name: run down}
        - {floor: 10, name: unwell, seen: looking unwell}
        - {floor: 0, name: gravely ill, seen: looking gravely ill}
  social:
    silence_minutes: 15 # counted while nobody in the conversation is still thinking
    skills_shareable: true
    ratings: false # the bedtime ratings are off for now; true turns them back on
  clock:
    speed_idle: 240 # a sleeping town passes 8 hours in 2 minutes
    speed_busy_one: 32 # one thinker's minute is half a simulated hour
    speed_busy_all: 8 # a saturated town's minute is eight
    idle_minutes: 60
  day:
    forced_sleep: "02:00"
    checkpoint: "02:30"
    forced_wake: "07:00"
    board_posted: "08:00" # the day's board goes up at the Workshop, replacing what is left of yesterday's
    sleep_at_most: "12:00" # hours and minutes, not an hour of the day
