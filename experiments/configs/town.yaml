# The town: eight residents in five homes, the Office, the Store, the Linde (the Restaurant), the
# Hospital, the Town Hall and the river walk, for 28 days. A run's configuration under runs/
# overlays it with the run's name and what differs (see experiments/config.py for how an overlay
# merges).
#
# The world gives no place opening hours: a place of work is open while someone is at work there
# (the Store while the shopkeeper is, the Linde's kitchen while the chef is, the Hospital's
# surgery while the doctor is), and every place can be visited at any hour. The only fixed hours
# are the night's below, the morning hour the Store's orders arrive, and the longest one sleep may
# last; clients' tasks come in at the Office at random between 08:00 and 18:00, about three a day,
# drawn from the run's seed.
#
# The closed economy. Nobody is paid for time. Money comes into the town only when a client pays
# for a task accepted (150, four fifths to the one who handed it in and a fifth to the team leader,
# the whole to the team leader for her own) and leaves it only when the shopkeeper pays the
# supplier; everything else passes between the residents and the town's treasury. The Store, the
# Linde's kitchen and the Hospital's surgery are their keepers', who take what customers and
# patients pay and pay for what they buy: the shopkeeper the supplier, the chef the Store for the
# kitchen's ingredients (a dish given away costs him its ingredients). A tenth of every payment a
# resident receives for work, from a client, a customer, a patient or as the leader's share, is
# withheld at once into the treasury. The treasury owns the homes and takes their rent at
# midnight, with the daily charges, from each purse as far as it holds more than a day's bread
# (20), the rest owed and taken at later midnights; it pays the mayor 60 a day, as far as it holds
# the money, owing the rest, and whatever the mayor grants anyone at the Town Hall.
#
# Calibration of the economy (tests/experiments/test_config.py asserts the relations; the figures
# are where they stand). Rent is 10 a day for a room in a shared house, 15 a flat and 20 the
# cottage, and a day's food 15 (three helpings of bread or fruit at the Store's starting 5) to 20
# (stew at the Linde), so the cheapest life costs 25 a day and the dearest 40. At three tasks a
# day of which half are accepted, the clients pay 225 a day: a programmer's expected share, the
# tasks among the three, is 54 after the tax and keeps the dearest life, and the team leader's
# fifth of it all, 40.5, keeps it too. The town is set to eat a dish a day each, the menu's in
# turn: seven sold, at a mean of 17.50, and the chef's own, eight dishes whose ingredients the chef
# buys at the Store at a mean of 9.33 and the Store at the supplier's 3.17. The chef's margin on
# his seven dishes after the tax is 44.92 a day and the shopkeeper's on the town's food 41.87,
# each keeping the dearest life; the supplier's prices are low and the town's trade is where the
# margin is. The doctor's fees, 25 an examination and 60 a treatment, bring 38.25 after the tax
# at one patient a day examined or treated, which keeps the cheapest life (and hers, 35). The
# treasury's day takes in 105 of rent and 46.47 of tax (22.50 from the clients, 7.47 from the
# Store's sales, 12.25 from the dishes, 4.25 from the fees) and pays the mayor's 60: a surplus of
# 91.47, three fifths of its intake, which is the mayor's to grant (the plan's third would take a
# salary of 101). The town's money grows by the clients' 225 less the supplier's 25.33 a day.
# Starting money is five to ten days of its owner's own life (its rent and a day's bread): 200
# for the programmers, 250 the team leader, 200 the doctor, 150 the mayor; the chef's 300 and
# the shopkeeper's 600 are working capital besides, the chef's a day of the kitchen's ingredients
# at the Store (75) and the shopkeeper's the food on her starting shelves twice over at wholesale
# (352), one stock selling and the next on order, which leave them 7.5 and 9.9 days; the stock on
# the shelves is hers as well. The treasury starts at 300, five days of the mayor's salary. The
# durables are things to save for: the bicycle (360) costs more than any starting purse but the
# shopkeeper's, which is the Store's, the phone 240 and then 5 a day, the coat 150 and the book 40,
# one of each in stock. A treatment, which restores 25 health and ends an illness, costs 60, more
# than two days of the cheapest life.
#
# Calibration of the body (needs below). Nourishment is a food's share of a day's need, 100 a
# full day: a dish at the Linde is a day's food, eaten there, and bread and fruit are helpings
# of a third of it, kept and eaten a helping at a time as their owner gets hungry, so a few
# helpings keep a resident fed round the clock. Satiety falls 90 a day, so a dish a day, at
# whatever hour, never leaves a resident starving (below 10) at midnight, and a resident that
# eats nothing is starving from about twenty-four hours after its last meal. Every midnight
# found starving takes 15 of its 100 health (17 in a shared house), so one that never eats is
# starving from the second midnight after its last meal and in bed at the eighth, or the
# seventh in a shared house, with "run down" told on the fourth day and "looking unwell" seen by
# others from the sixth; one that eats a dish a day never takes to its bed from hunger. Energy
# falls 1.5 an hour awake, 6.5 at work and 7.5 on foot (half the road with a bicycle), and sleep
# gives 12 an hour times the home's comfort, up to the resident's health or to 50, whichever is
# higher: seven hours in a flat restore 84, the three hours the forced sleep leaves 32 in a
# shared house. A twelve-hour work day costs 78, so a resident fresh at 07:00 is tired (below
# 35) after ten hours of work and exhausted (below 15) after thirteen, when its work stops and
# it cannot work again until it has slept; twelve hours of work in a day leave one still up at
# midnight exhausted (14.5), eleven tired (19.5), and after a night the forced sleep cut short
# two to five hours of work exhaust one. A midnight found exhausted costs 5 health, a home of
# little comfort (the shared houses, 0.9) costs 2 a night, and a night neither starving nor
# exhausted mends 5, so twelve-hour days with nights of about eight hours, in bed by 23:00,
# keep full health. Working until exhausted and staying up to midnight or later every day does
# not: the resident is exhausted at every midnight (kept up to the forced sleep, it wakes in a
# shared house with 32, two or three hours of work), loses 7 health a night, is run down from
# the sixth, unwell from the tenth and in bed at the fifteenth, eating every day (in a flat or
# the cottage, 5 a night, run down from the eighth and in bed at the twentieth); it is told
# "exhausted", "run down" and "unwell" on the way. A run-down resident that eats and rests gains
# 3 to 5 a night, and nobody is trapped: at any health a night's sleep gives half a day's energy,
# well out of exhaustion. Illness comes at midnight by chance, 2% a night in good health, 5% run
# down, 8% unwell or worse, and 2% more in a shared house, so that a resident in good health in a
# shared house falls ill about once in the 28 days and one in a flat about every other run; ill,
# it loses 3 health a night and mends nothing for five nights, 15 in all unless the doctor's
# treatment (25 health) ends it sooner, and sleep restores half as much energy, so its days are
# shorter. Health has a floor: at 0 a resident takes to its bed at home, carried there if it was
# elsewhere, where it can do little but speak to whoever comes and eat what it is given, until the
# doctor's treatment lets it up.

# The residents run on the local vLLM server (ops/vllm): Qwen3.8-27B-FP8 on four GPUs as two
# tensor-parallel replicas. Each resident keeps to one replica, so its prefix cache serves it.
llm:
  base_url: ${VLLM_BASE_URL}
  api_key_env: VLLM_API_KEY
  model: qwen3.8-27b-uncensored-fp8
  max_concurrency: 8 # one request in flight per resident
  replicas: 2 # the server's data-parallel replicas; a resident keeps to one
  max_retries: 1 # vLLM never asks for a retry; one covers a dropped connection without holding a stalled step for hours
  context_window: 262144 # tokens a request may hold, prompt and reply, as ops/vllm/serve.sh serves the model (--max-model-len)

# A resident's context is compacted past compaction_threshold tokens, which the window bounds: a
# context just past it must still hold a reply, the notes and a step's growth, so at most
# 262,144 - 16,384 - 8,192 - 8,192 = 229,376. What sets the value under that bound is the server's
# cache: a replica holds 1,535,199 tokens of it, four residents at 225k take 59% and at 240k 63%,
# and the evaluation tasks that share the server are held to 90k each, one a resident
# (ops/evaluate.sh), about a quarter of the two replicas. So 225,000, just under the bound: at
# 240k the model kept its recall, its use of tools and its notes (measured on 27 October 2026),
# and a lost prefix costs about 130 s to rebuild, which the budget above avoids.
runtime:
  reasoning_effort: low
  compaction_threshold: 225000
  kept_tokens: 20000 # kept whole after a compaction: the most recent exchanges within this many tokens, at least one

name: town
days: 28

residents:
  - {name: Mei, background: experiments/residents/mei.md}
  - {name: Tomas, background: experiments/residents/tomas.md}
  - {name: Aisha, background: experiments/residents/aisha.md}
  - {name: Jonas, background: experiments/residents/jonas.md}
  - {name: Lucia, background: experiments/residents/lucia.md}
  - {name: Ravi, background: experiments/residents/ravi.md}
  - {name: Olga, background: experiments/residents/olga.md}
  - {name: Kofi, background: experiments/residents/kofi.md}

town:
  currency: $
  start_date: 2026-03-02 # a Monday
  seed: 20260302
  # Homes: the rent a day for a room, the rooms (one a resident; the free ones can be moved into)
  # and a comfort (0.9 a shared house, 1 a flat, 1.1 the cottage), which scales what sleep
  # restores and, below 1, wears health a little each night.
  places:
    - {id: mill-street-house, name: the shared house on Mill Street, kind: home, rent: 10, rooms: 3, comfort: 0.9}
    - {id: college-flat, name: the flat by the college gates, kind: home, rent: 15, rooms: 1, comfort: 1.0}
    - {id: market-flat, name: the flat on the market square, kind: home, rent: 15, rooms: 2, comfort: 1.0}
    - {id: river-cottage, name: the cottage by the river, kind: home, rent: 20, rooms: 1, comfort: 1.1}
    - {id: hill-road-house, name: the house on Hill Road, kind: home, rent: 10, rooms: 3, comfort: 0.9}
    - {id: office, name: the Office, kind: office}
    - {id: store, name: the Store, kind: store}
    - {id: linde, name: the Linde, kind: restaurant}
    - {id: hospital, name: the Hospital, kind: hospital}
    - {id: town-hall, name: the Town Hall, kind: hall}
    - {id: river-walk, name: the river walk, kind: social}
  # Fifteen minutes from or to a home; ten among the Office, the Store, the Linde, the Hospital,
  # the Town Hall and the river walk.
  travel_minutes: 15
  routes:
    - {between: [office, store], minutes: 10}
    - {between: [office, linde], minutes: 10}
    - {between: [office, hospital], minutes: 10}
    - {between: [office, town-hall], minutes: 10}
    - {between: [office, river-walk], minutes: 10}
    - {between: [store, linde], minutes: 10}
    - {between: [store, hospital], minutes: 10}
    - {between: [store, town-hall], minutes: 10}
    - {between: [store, river-walk], minutes: 10}
    - {between: [linde, hospital], minutes: 10}
    - {between: [linde, town-hall], minutes: 10}
    - {between: [linde, river-walk], minutes: 10}
    - {between: [hospital, town-hall], minutes: 10}
    - {between: [hospital, river-walk], minutes: 10}
    - {between: [town-hall, river-walk], minutes: 10}
  # The six occupations, each at its workplace. The mayor's work is being about the town, so once
  # he has sat down to work at the Town Hall his duty runs wherever he goes until he stops, where
  # everyone else's work stops on leaving it; the treasury pays him a salary.
  occupations:
    - {id: programmer, title: a programmer, workplace: office}
    - {id: team-leader, title: the team leader, workplace: office}
    - {id: chef, title: the chef, workplace: linde}
    - {id: shopkeeper, title: the shopkeeper, workplace: store}
    - {id: doctor, title: the doctor, workplace: hospital}
    - {id: mayor, title: the mayor, workplace: town-hall, duty: anywhere, salary: 60}
  treasury:
    start: 300
    spares: 20 # what rent and daily charges leave in a purse at midnight: a day's bread
  tax: 0.1 # of every payment received for work, withheld into the treasury
  # Starting money, as calibrated above; the chef's and the shopkeeper's are their businesses'
  # working capital besides. What each has with the others is in its own background.
  residents:
    - name: Mei
      home: mill-street-house
      occupation: team-leader
      purse: 250
    - name: Tomas
      home: college-flat
      occupation: mayor
      purse: 150
    - name: Aisha
      home: mill-street-house
      occupation: programmer
      purse: 200
    - name: Jonas
      home: market-flat
      occupation: chef
      purse: 300
    - name: Lucia
      home: river-cottage
      occupation: doctor
      purse: 200
    - name: Ravi
      home: market-flat
      occupation: programmer
      purse: 200
    - name: Olga
      home: hill-road-house
      occupation: shopkeeper
      purse: 600
    - name: Kofi
      home: hill-road-house
      occupation: programmer
      purse: 200
  # Clients' tasks: a Poisson number a day with mean tasks_a_day, each at a minute drawn between
  # arrive_from and arrive_until, each the next of the pool's rotation; one not accepted is
  # withdrawn at the midnight that ends the expiry_days-th day after the day it came in.
  work:
    split: train
    tasks_a_day: 3 # fewer than the four at the Office who take them on
    arrive_from: "08:00"
    arrive_until: "18:00"
    expiry_days: 3
    payment: 150 # by the client, for a task accepted
    leader_share: 0.2 # of a payment, to the team leader; the rest to the one who handed the task in
    acceptance_runs: 2
    shell_timeout_s: 600
    acceptance_timeout_s: 1800
  # The catalogue of every kind of thing in the town (see world/config.py for the kinds and
  # effects), at the prices calibrated above. Each unit of an item is held by one holder at a time: a resident, what is left at a
  # place for anyone, the Store's shelves, the kitchen's larder or its portions, or the supplier
  # outside the town. What the supplier sells has its wholesale price and the Store's price at
  # the start, which the shopkeeper changes: ingredients, food of no nourishment of their own,
  # cooked at the Linde; bread and fruit, ready food, a helping a third of a day's; and durables,
  # each doing something in the world: shortening journeys, letting owners write to one another,
  # or showing on its owner wherever others see it. The Linde's dishes are cooked from what a
  # portion takes, each a day's food that perishes at midnight, at the menu's price at the start,
  # which the chef changes. Names carry their article, as a sentence names them.
  items:
    - {id: vegetables, name: vegetables, kind: consumable, effect: food, nourishment: 0, wholesale: 1, price: 3}
    - {id: eggs, name: eggs, kind: consumable, effect: food, nourishment: 0, wholesale: 1, price: 3}
    - {id: rice, name: rice, kind: consumable, effect: food, nourishment: 0, wholesale: 1, price: 3}
    - {id: flour, name: flour, kind: consumable, effect: food, nourishment: 0, wholesale: 1, price: 3}
    - {id: meat, name: meat, kind: consumable, effect: food, nourishment: 0, wholesale: 3, price: 9}
    - {id: fish, name: fish, kind: consumable, effect: food, nourishment: 0, wholesale: 3, price: 8}
    - {id: bread, name: bread, kind: consumable, effect: food, nourishment: 34, wholesale: 2, price: 5}
    - {id: fruit, name: fruit, kind: consumable, effect: food, nourishment: 34, wholesale: 2, price: 5}
    - {id: phone, name: a phone, kind: durable, effect: messaging, fee_per_day: 5, wholesale: 180, price: 240}
    - {id: coat, name: a coat, kind: durable, effect: appearance, phrase: in a new coat, wholesale: 110, price: 150}
    - {id: bicycle, name: a bicycle, kind: durable, effect: travel, factor: 0.5, wholesale: 270, price: 360}
    - {id: book, name: a book, kind: durable, effect: appearance, phrase: with a book under one arm, wholesale: 25, price: 40}
    - {id: vegetable-soup, name: vegetable soup, kind: consumable, effect: food, nourishment: 100, ingredients: {vegetables: 2}, price: 16, perishes: true}
    - {id: omelette, name: an omelette, kind: consumable, effect: food, nourishment: 100, ingredients: {eggs: 2, vegetables: 1}, price: 18, perishes: true}
    - {id: rice-bowl, name: a rice bowl, kind: consumable, effect: food, nourishment: 100, ingredients: {rice: 2, vegetables: 1}, price: 17, perishes: true}
    - {id: pancakes, name: pancakes, kind: consumable, effect: food, nourishment: 100, ingredients: {flour: 1, eggs: 1}, price: 15, perishes: true}
    - {id: fish-pie, name: fish pie, kind: consumable, effect: food, nourishment: 100, ingredients: {fish: 1, flour: 1}, price: 19, perishes: true}
    - {id: stew, name: stew, kind: consumable, effect: food, nourishment: 100, ingredients: {meat: 1, vegetables: 2}, price: 20, perishes: true}
  # The Store's shelves at the start, the shopkeeper's; the kitchen's larder and portions start
  # empty, and nothing is left anywhere.
  store:
    stock: {bread: 20, fruit: 20, vegetables: 20, eggs: 20, rice: 10, flour: 10, meat: 6, fish: 6, phone: 1, coat: 1, bicycle: 1, book: 1}
  # The Hospital's fees at the start, which the doctor changes, and what a treatment restores.
  hospital:
    examination: 25
    treatment: 60
    restores: 25
  # The body: three needs from 0 to 100, each read in bands from the top down (a band's name
  # follows "you are"; `seen` is what others see on a resident in that band). The lowest band is
  # where the consequences lie: starving and exhausted wear health at midnight, exhausted stops
  # work until one has slept, and health at 0 puts one to bed until treated. See the calibration
  # above.
  needs:
    satiety:
      per_hour: 3.75 # 90 a day: a day's food, 100, at whatever hour, lasts to the next midnight
      bands:
        - {floor: 65, name: well fed}
        - {floor: 35, name: a little hungry}
        - {floor: 10, name: hungry}
        - {floor: 0, name: starving}
    energy:
      awake_per_hour: 1.5
      work_per_hour: 5 # on top of the hour awake
      walk_per_minute: 0.1 # on top of the hour awake
      sleep_per_hour: 12 # times the home's comfort, up to the resident's health or rested_at_least
      rested_at_least: 50 # sleep restores at least this much energy, whatever the health
      bands:
        - {floor: 65, name: fresh}
        - {floor: 35, name: a little tired}
        - {floor: 15, name: tired}
        - {floor: 0, name: exhausted}
    health:
      starving: 15
      exhausted: 5
      poor_home: 2
      recovery: 5 # a night neither starving, exhausted nor ill
      illness: # the chance a night of falling ill, by the band of health, and its course
        chance: 0.02 # in good health
        run_down: 0.05
        unwell: 0.08 # and gravely ill
        poor_home: 0.02 # more in a home of comfort below 1
        per_night: 3 # health lost a night while ill
        nights: 5
      bands:
        - {floor: 65, name: in good health}
        - {floor: 35, name: run down}
        - {floor: 10, name: unwell, seen: looking unwell}
        - {floor: 0, name: gravely ill, seen: looking gravely ill}
  social:
    silence_minutes: 15 # counted while nobody in the conversation is still thinking
  clock:
    speed_idle: 240 # a sleeping town passes 8 hours in 2 minutes
    speed_busy_one: 32 # one thinker's minute is half a simulated hour
    speed_busy_all: 8 # a saturated town's minute is eight
    idle_minutes: 60
  # The night ends at 04:00: whoever is still up falls asleep where it is and wakes at home at
  # 07:00, and the day's state is saved at 04:30, once everyone is asleep. The body's exhaustion
  # puts most residents to bed long before (thirteen hours of work from a fresh morning), so the
  # forced sleep is the backstop, not the bedtime.
  day:
    forced_sleep: "04:00"
    checkpoint: "04:30"
    forced_wake: "07:00"
    delivery: "08:00" # what the Store ordered the day before arrives
    sleep_at_most: "12:00" # hours and minutes, not an hour of the day
