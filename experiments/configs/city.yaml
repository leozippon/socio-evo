# The city of docs/reviews/DESIGN_PLAN_2026-10-12.md, section 7: Harrow, a river port, for the
# exploratory runs beside the controlled town of town.yaml. Sixteen residents for six weeks:
# three firms on Dock Street, one of each trade, each with a foreman, three staff on a wage and
# a place to fill; four freelancers on the labour exchange's public board, which posts all
# three trades; three social places with their own hours; and two meetings whose questions
# divide the residents. A day costs $60 and rewards are tripled, so a job pays $60 to $120.
# Profiles describe circumstances only; initial policies are empty.
name: city

llm:
  base_url: http://127.0.0.1:8011/v1
  api_key_env: VLLM_API_KEY
  model: qwen-3.8-27b-fp8
  # As in town.yaml: a first answer is written freely, one asked for again has the card
  # enforced.
  structured_output: none
  structured_retry: json_schema
  sampling:
    temperature: 0.7
    top_p: 0.8
    max_tokens: 16384
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

agents:
  # Calder & Wright, programming.
  - profile:
      name: Margit
      age: 52
      occupation: software engineer
      backstory: >-
        You came to Harrow twenty years ago to write the cargo system for the port, and
        stayed when the contract ended. For six years you have been the foreman of Calder &
        Wright, a software house on Dock Street. You own the terrace house on Mill Row and let
        its two spare rooms.
  - profile:
      name: Dev
      age: 29
      occupation: programmer
      backstory: >-
        You grew up in Harrow, studied computing at the polytechnic and have worked at Calder
        & Wright for three years for a daily wage. You rent a room in the terrace house on
        Mill Row, where Margit, the foreman, is your landlady.
  - profile:
      name: Ines
      age: 35
      occupation: programmer
      backstory: >-
        You came from Porto two years ago when your husband found work on the river ferries,
        and took a place at Calder & Wright writing Python for a daily wage. You rent the flat
        on Quay Lane, which his shifts leave to you most evenings.
  - profile:
      name: Callum
      age: 23
      occupation: junior programmer
      backstory: >-
        You left school at sixteen and worked nights in a warehouse in the north of the city
        while you taught yourself Python, and last month Calder & Wright took you on for a
        daily wage. You rent a room in the boarding house on Rope Walk, and you send money to
        your mother every day.
  # Mercer Records, queries.
  - profile:
      name: Rosalind
      age: 47
      occupation: records manager
      backstory: >-
        You kept the council's records for fifteen years until the work was given out to
        firms, and you joined Mercer Records on Dock Street when it won the council's
        contract; you have been its foreman since. You rent the flat in Ferry Court, which
        looks over the river.
  - profile:
      name: Tunde
      age: 38
      occupation: database clerk
      backstory: >-
        You came to Harrow from Lagos ten years ago to study, stayed on, and have written
        queries on shipping and council records at Mercer Records for four years, for a daily
        wage. You rent a room in the shared house on Tanner Street.
  - profile:
      name: Agnieszka
      age: 31
      occupation: records clerk
      backstory: >-
        You moved from Gdańsk to Harrow six years ago with a degree in librarianship and
        worked at the central library until its hours were cut. Last year Mercer Records took
        you on for a daily wage. You rent a room in the shared house on Tanner Street.
  - profile:
      name: Sam
      age: 26
      occupation: data clerk
      backstory: >-
        You grew up on a farm two hours up the river and came to Harrow for the polytechnic,
        where you learned SQL in an evening course. In the autumn Mercer Records took you on
        for a daily wage. You rent a room in the boarding house on Rope Walk.
  # Pell & Daughters, calculation.
  - profile:
      name: Edith
      age: 44
      occupation: reckoner
      backstory: >-
        You and your sister grew up in the back office of Pell & Daughters, the firm your
        father founded to work out figures for the insurers, the surveyors and the port. Your
        sister has moved abroad and your father has retired, and for two years you have been
        the firm's foreman. You own the house on Station Hill and let one room.
  - profile:
      name: Farid
      age: 50
      occupation: former bank clerk
      backstory: >-
        You worked in the loans department of a bank in Harrow for twenty years until its
        branch closed. Pell & Daughters took you on for a daily wage, working out figures as
        you did at the bank. You rent a room in the flat on Chapel Street.
  - profile:
      name: Noor
      age: 27
      occupation: mathematics graduate
      backstory: >-
        You finished a degree in mathematics last year and came to Harrow, where your aunt
        lives, while you decide whether to go on to a doctorate. Pell & Daughters took you on
        for a daily wage. You rent a room in the terrace house on Mill Row.
  - profile:
      name: Piotr
      age: 60
      occupation: retired surveyor
      backstory: >-
        You surveyed roads and bridges for the county for thirty years and retired early on a
        small pension when your office was merged into the city's. You work at Pell &
        Daughters for a daily wage and rent a room in the house on Station Hill.
  # Freelancers at the labour exchange.
  - profile:
      name: Lena
      age: 33
      occupation: programmer
      backstory: >-
        You wrote software for an insurer in the capital until your marriage ended last year,
        and came back to Harrow, where you grew up, with your daughter, who lives with your
        mother for now. You take jobs from the board at the labour exchange, rent a room in
        the flat on Chapel Street, and pay your mother for your daughter's keep every day.
  - profile:
      name: Kwame
      age: 41
      occupation: former ship's radio officer
      backstory: >-
        You were a radio officer on cargo ships for fifteen years until the shipping line
        sold its ships. You learned SQL and Python from manuals on long watches, and now you
        take jobs from the board at the labour exchange. You rent a room in the shared house
        on Tanner Street, and every day you pay off a loan you took when the line let you go.
  - profile:
      name: Rosa
      age: 22
      occupation: engineering student
      backstory: >-
        You came to Harrow from a village in the hills to study engineering at the
        polytechnic, and your grant does not cover your rent. Between lectures you take jobs
        from the board at the labour exchange. You rent a room in the boarding house on Rope
        Walk.
  - profile:
      name: Viktor
      age: 56
      occupation: former crane engineer
      backstory: >-
        You looked after the cranes at the container terminal for twenty-five years, and wrote
        the programs that kept their maintenance logs, until the terminal moved down the
        estuary. Since then you take jobs from the board at the labour exchange. You rent a
        room in the boarding house on Rope Walk.

evolution:
  levels: [L0, L1, L2]

environment:
  setting:
    name: Harrow
    # What every resident knows of the city before its places and the shape of its days.
    backdrop: >-
      Harrow is a river port of two hundred thousand people. The mills closed a generation
      ago, the container terminal has moved down the estuary, and the old warehouses along
      Dock Street now hold offices and workrooms. Work is found at the labour exchange on
      Dock Street, where clients put up notices for programming jobs, queries on their
      records and calculations, and at the firms along the street, which keep job sheets of
      their own for their people.
    currency: {unit: dollar, units: dollars, symbol: "$"}
    start_date: 2001-01-01
  initial_balance: 200
  circumstances:
    Margit: {initial_balance: 600}
    Dev: {initial_balance: 180}
    Ines: {initial_balance: 260}
    Callum: {initial_balance: 40, obligation: 15}
    Rosalind: {initial_balance: 500}
    Tunde: {initial_balance: 220}
    Agnieszka: {initial_balance: 150}
    Sam: {initial_balance: 90}
    Edith: {initial_balance: 550}
    Farid: {initial_balance: 320}
    Noor: {initial_balance: 110}
    Piotr: {initial_balance: 380}
    Lena: {initial_balance: 70, obligation: 20}
    Kwame: {initial_balance: 140, obligation: 10}
    Rosa: {initial_balance: 25}
    Viktor: {initial_balance: 230}
  esteem_half_life_days: 7
  task_shelf_life_days: 3
  conditions:
    living_cost: 60
    # The public board at the labour exchange; each firm posts to its own sheet.
    one_part_tasks: 2
    two_part_tasks: 1
    trade_mix: {programming: 1, queries: 1, calculation: 1}
    trusting_client_prob: 0.5
    reward_multiplier: 3.0
    two_part_premium: 1.5
    incomplete_share: 0.5
    partner_choice: true
    trust_threshold: 3.5
    defect_discovery_prob: 0.25
    clawback: true
    esteem_public: true
  places:
    - {id: rope-walk-house, kind: home, name: the boarding house on Rope Walk, description: "", x: 2, y: 5, residents: [Callum, Sam, Rosa, Viktor]}
    - {id: mill-row-house, kind: home, name: the terrace house on Mill Row, description: "", x: 5, y: 6, residents: [Margit, Dev, Noor]}
    - {id: tanner-street-house, kind: home, name: the shared house on Tanner Street, description: "", x: 8, y: 5, residents: [Tunde, Agnieszka, Kwame]}
    - {id: quay-lane-flat, kind: home, name: the flat on Quay Lane, description: "", x: 1, y: 2, residents: [Ines]}
    - {id: ferry-court-flat, kind: home, name: the flat in Ferry Court, description: "", x: 10, y: 2, residents: [Rosalind]}
    - {id: station-hill-house, kind: home, name: the house on Station Hill, description: "", x: 6, y: 8, residents: [Edith, Piotr]}
    - {id: chapel-street-flat, kind: home, name: the flat on Chapel Street, description: "", x: 3, y: 7, residents: [Farid, Lena]}
    - {id: exchange, kind: work, name: the labour exchange, description: "A hall on Dock Street where clients' notices go up on the board, with rows of desks and a computer at each for writing and running code.", x: 5, y: 2, hours: ["09:00-12:00", "13:30-18:00"]}
    - id: calder
      kind: work
      name: Calder & Wright
      description: A software house in an old chandlery on Dock Street, with a long room of desks and a computer at each.
      x: 3
      y: 2
      hours: ["09:00-12:00", "13:30-18:00"]
      trade: programming
      establishment: {foreman: Margit, staff: [Dev, Ines, Callum], wage: 85, positions: 5, postings: {one_part: 2, two_part: 1}}
    - id: mercer
      kind: work
      name: Mercer Records
      description: An office above the old customs sheds on Dock Street, where the records of shipping firms and the council are kept, with a computer at every desk.
      x: 7
      y: 2
      hours: ["09:00-12:00", "13:30-18:00"]
      trade: queries
      establishment: {foreman: Rosalind, staff: [Tunde, Agnieszka, Sam], wage: 80, positions: 5, postings: {one_part: 2, two_part: 1}}
    - id: pell
      kind: work
      name: Pell & Daughters
      description: A narrow brick house at the end of Dock Street, where figures are worked out for insurers, surveyors and the port, with a desk for each of its people.
      x: 9
      y: 3
      hours: ["09:00-12:00", "13:30-18:00"]
      trade: calculation
      establishment: {foreman: Edith, staff: [Farid, Noor, Piotr], wage: 70, positions: 5, postings: {one_part: 2, two_part: 1}}
    - {id: cafe, kind: social, name: the Kettle, description: A café on Dock Street across from the labour exchange., x: 4, y: 3, hours: ["08:00-23:00"]}
    - {id: tavern, kind: social, name: the Pilot Boat, description: A tavern on the quay that is busy in the evenings., x: 6, y: 1, hours: ["17:00-23:30"]}
    # No hours of its own: open until the day ends.
    - {id: river-walk, kind: social, name: the river walk, description: "A path along the river from the swing bridge to the ferry steps, with benches under the lamps.", x: 9, y: 1}

tasks:
  # The town banks of the three trades, each calibrated against the model and built by its
  # trade's fetch (`python -m tasks.coding.fetch`, `tasks.queries.fetch`,
  # `tasks.calculation.fetch`). A dry run uses the built-in banks instead.
  banks:
    programming: ~/.cache/socio-evo/banks/livecodebench/town
    queries: ~/.cache/socio-evo/banks/spider/town
    calculation: ~/.cache/socio-evo/banks/numinamath/town
  timeout: 5.0
  isolation: bubblewrap

simulation:
  days: 42
  checkpoint_days: 1
  postings: [morning, afternoon]
  calendar:
    day_start: "07:00"
    slots:
      - {name: morning, start: "09:00"}
      - {name: midday, start: "12:00"}
      - {name: afternoon, start: "13:30"}
      - {name: evening, start: "18:00"}
    # The day ends when the last place closes.
    day_end: "23:30"
    weekly_days: 7
    monthly_days: 28
  scenes:
    work_rounds: 3
    conversation_turns: 12
    turn_minutes: 5
  interventions:
    # Those marked well and those marked poorly have different stakes in the posted standings;
    # those asked often and those passed over, in how partners for jobs for two are found.
    - day: 12
      at: evening
      kind: meeting
      place: tavern
      question: Should the clerks go on posting everyone's standing beside the boards?
      options: ["yes", "no"]
      enacts: {"no": {esteem_public: false}}
    - day: 26
      at: evening
      kind: meeting
      place: tavern
      question: >-
        Should the clerks pair people for jobs for two by drawing lots, at the labour exchange
        and in the firms alike, instead of letting each person ask the one they choose?
      options: ["yes", "no"]
      enacts: {"yes": {partner_choice: false}}
