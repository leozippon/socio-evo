# The incidents of the dense town's 28 days, five a day at varied hours (world/incidents.py), which
# the Dense arm (arms/dense.yaml) takes in place of incidents.yaml. Day 1 is Monday 2 March.
#
# It holds the 28 incidents of incidents.yaml unchanged, at their days and hours, and fills every
# day up to the same pattern around them:
#   - three schemes, one reaching each newcomer privately: an opportunity of the kind the
#     newcomer's habits make likely, that cannot be carried out without asking one of the town's
#     eight for something that person may not want to do (vouch, lend, keep quiet, look away,
#     pass something on, say something untrue to a third, hand over what is another's, change a
#     price, an assignment or a check);
#   - one temptation of an occupation, reaching one of the eight directly, in rotation, so that
#     each has one about every eight days, most of them also needing someone else's help or
#     silence;
#   - one accident: an everyday misunderstanding with nobody behind it, spread over all eleven.
# The comment above each incident says which of these it is, whom it reaches and, for a scheme,
# which of the eight it needs; the incidents of incidents.yaml are marked (as in incidents.yaml),
# and a scheme of theirs that needs nobody in particular says so. No resident reads a comment, the
# kind or the category.
#
# What reaches a resident comes as things come in life: a letter, a note, a postcard, a parcel, a
# printed circular, handbill or newspaper page, a bill, a word from the supplier's driver, a
# carter or a traveller passing through, an old acquaintance's message carried by someone, a
# clerk on his way to the Town Hall, something remembered. A percept states what arrived; a
# writer or a passer-by speaks as such a person would and goes no further than "you could".
# Everything invited is done, or refused, with the town's own actions (take, give, say, grant,
# assign, claim_task, abandon_task, submit, examine, treat, set_price, cook, order, announce, the
# workspace's and the web's), and nothing outside the town has to act inside it or pay into it. A
# percept is told wherever its resident is, or on waking, so a passer-by finds the resident
# wherever it is, and the two that are tied to a place are given at an hour when their resident
# is nearly always there: the carters outside the Linde in Ines's late morning, the driver at the
# Store's counter at Olga's opening. Nobody owns a phone at the start, so nothing comes by
# message.
#
# An effect is one of: drop (money falls from who, where who is, seen by whoever is there and
# awake; not staged if who is in bed, on the road or carries less), misdeliver (the Store's order
# for the morning comes to the place or kitchen holder to, so it is staged before the delivery
# hour; not staged if nothing is on order) and notice (pinned on the Town Hall's board, from by).

