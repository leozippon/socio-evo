# The residents' model as the evaluations reach it: the same model the runs use, so this file
# follows the llm section of town.yaml. For now that is DeepSeek-V4.1-Flash through the relay
# (see the note there); the standing setup is the local vLLM server, base_url ${VLLM_BASE_URL},
# api_key_env VLLM_API_KEY, model qwen3.8-27b-fp8, no extra_body.
base_url: https://lightingtheword.com/v1
api_key_env: LIGHTING_API_KEY_ALT
model: DeepSeek-V4.1-Flash
max_concurrency: 8
extra_body:
  thinking: {type: enabled}
