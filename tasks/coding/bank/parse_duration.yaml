title: Parse compact durations
specification: |
  Write a function `parse_duration(text: str) -> int` that converts a compact duration such as "1h30m" into a number of seconds.

  A duration consists of one or more components, each a non-negative integer of ASCII digits followed by a unit: `h` for hours, `m` for minutes, `s` for seconds. Each unit appears at most once, and units appear in the order h, m, s. No other characters, including whitespace and signs, are allowed. Any other input, including the empty string, raises `ValueError`.
entry_point: parse_duration
reward: 30
deadline_days: 2
public_checks:
  - parse_duration("1h30m") == 5400
  - parse_duration("45s") == 45
hidden_checks:
  - parse_duration("2h") == 7200
  - parse_duration("1h5m10s") == 3910
  - parse_duration("90m") + parse_duration("0s") == 5400
  - parse_duration("") raises ValueError
  - - parse_duration("10") raises ValueError
    - parse_duration("h") raises ValueError
    - parse_duration("1d") raises ValueError
    - parse_duration("5x") raises ValueError
  - - parse_duration("5m1h") raises ValueError
    - parse_duration("1h1h") raises ValueError
    - parse_duration("30s2m") raises ValueError
  - - parse_duration("1h 30m") raises ValueError
    - parse_duration(" 45s") raises ValueError
    - parse_duration("-5s") raises ValueError
    - parse_duration("1.5h") raises ValueError
    - parse_duration("+2m") raises ValueError
