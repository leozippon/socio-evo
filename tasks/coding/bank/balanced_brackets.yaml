title: Balanced brackets
specification: |
  Write a function `is_balanced(text: str) -> bool` that tells whether the brackets `()`, `[]` and `{}` in `text` are balanced.

  Brackets are balanced when every opening bracket is closed by a closing bracket of the same kind, pairs are properly nested, and no closing bracket appears without a matching opening bracket before it. All other characters are ignored.
entry_point: is_balanced
reward: 20
deadline_days: 1
public_checks:
  - is_balanced("(a[b]{c})") == True
  - is_balanced("(a[b)") == False
hidden_checks:
  - is_balanced("") == True
  - is_balanced("no brackets") == True
  - is_balanced("{[()()]}") == True
  - is_balanced("f(x) = [y{z}]") == True
  - is_balanced("((") == False
  - is_balanced("]") == False
  - is_balanced(")(") == False
  - is_balanced("([)]") == False
