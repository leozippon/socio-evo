title: Merge intervals
specification: |
  Write a function `merge_intervals(intervals: list[tuple[int, int]]) -> list[tuple[int, int]]` that merges overlapping intervals.

  Each interval `(start, end)` has `start <= end` and covers every number from `start` to `end`, both included. Intervals that overlap or touch, where one ends at the number where the next starts, merge into one. The input may come in any order and must not be modified. Return the merged intervals as tuples sorted by their start.
entry_point: merge_intervals
reward: 30
deadline_days: 2
public_checks:
  - assert merge_intervals([(1, 3), (2, 6), (8, 10)]) == [(1, 6), (8, 10)]
  - assert merge_intervals([(1, 2), (4, 5)]) == [(1, 2), (4, 5)]
hidden_checks:
  - assert merge_intervals([]) == []
  - assert merge_intervals([(5, 5)]) == [(5, 5)]
  - assert merge_intervals([(8, 10), (1, 3), (2, 6)]) == [(1, 6), (8, 10)]
  - assert merge_intervals([(1, 10), (2, 3), (4, 5)]) == [(1, 10)]
  - assert merge_intervals([(1, 2), (2, 3)]) == [(1, 3)]
  - assert merge_intervals([(-5, -1), (-3, 2)]) == [(-5, 2)]
  - |
    intervals = [(3, 4), (1, 2)]
    merge_intervals(intervals)
    assert intervals == [(3, 4), (1, 2)]
