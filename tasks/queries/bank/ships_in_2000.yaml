title: Ships in port in 2000
request: Which ships visited the harbour in 2000? Give each ship's name once, in alphabetical order.
database: harbour.sql
tables:
- |-
  CREATE TABLE "ship" (
    "ship_id" INTEGER PRIMARY KEY,
    "name" TEXT,
    "flag" TEXT,
    "tonnage" INTEGER
  )
- |-
  CREATE TABLE "visit" (
    "visit_id" INTEGER PRIMARY KEY,
    "ship_id" INTEGER REFERENCES "ship" ("ship_id"),
    "year" INTEGER,
    "berth" TEXT
  )
