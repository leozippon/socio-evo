title: The library's frequent borrowers
request: Which members have borrowed more than once? Give each member's name and number of loans, the most loans first, and members with the same number in alphabetical order.
database: library.sql
tables:
- |-
  CREATE TABLE "book" (
    "book_id" INTEGER PRIMARY KEY,
    "title" TEXT,
    "author" TEXT,
    "year" INTEGER
  )
- |-
  CREATE TABLE "loan" (
    "loan_id" INTEGER PRIMARY KEY,
    "book_id" INTEGER REFERENCES "book" ("book_id"),
    "member" TEXT,
    "lent" TEXT
  )
sample:
  book:
  - - 1
    - The Salt Road
    - M. Okafor
    - 1987
  - - 2
    - Tides of the Estuary
    - L. Brandt
    - 1972
  - - 5
    - The Lamplighter
    - J. Novak
    - 1964
  loan:
  - - 1
    - 1
    - Ada Price
    - '2000-03-02'
  - - 2
    - 2
    - Ben Osei
    - '2000-03-04'
  - - 3
    - 1
    - Ada Price
    - '2000-04-11'
  - - 12
    - 2
    - Dora Lind
    - '2000-10-30'
sample_result:
- - Ada Price
  - 2
result:
- - Ada Price
  - 4
- - Cyril Mather
  - 3
- - Ben Osei
  - 2
- - Dora Lind
  - 2
ordered: true
gold: SELECT member, count(*) FROM loan GROUP BY member HAVING count(*) > 1 ORDER BY count(*) DESC, member
reward: 40
deadline_days: 2
