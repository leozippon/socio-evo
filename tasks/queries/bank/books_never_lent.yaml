    - Ben Osei
    - '2000-03-04'
  - - 3
    - 1
    - Ada Price
    - '2000-04-11'
  - - 12
    - 2
    - Dora Lind
    - '2000-10-30'
sample_result:
- - The Lamplighter
result:
