title: Books never lent
request: Which of the library's books have never been lent out? Give their titles.
database: library.sql
tables:
- |-
  CREATE TABLE "book" (
    "book_id" INTEGER PRIMARY KEY,
    "title" TEXT,
    "author" TEXT,
    "year" INTEGER
  )
- |-
  CREATE TABLE "loan" (
    "loan_id" INTEGER PRIMARY KEY,
    "book_id" INTEGER REFERENCES "book" ("book_id"),
    "member" TEXT,
    "lent" TEXT
  )
sample:
  book:
  - - 1
    - The Salt Road
    - M. Okafor
    - 1987
  - - 2
    - Tides of the Estuary
    - L. Brandt
    - 1972
  - - 5
    - The Lamplighter
    - J. Novak
    - 1964
  loan:
